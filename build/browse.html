<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>找爆款</title>
<style>
  :root { --ink: #1f2622; --muted: #6b746f; --line: #e5e9e6; --chip: #f1f4f2; --brand: #2f6b4f; --brand-ink: #fff; --warn: #b54a2c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 56px; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: #fff; }
  .bar { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .nav { display: flex; gap: 2px; }
  .ib { width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #5c6560; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ib:hover:not(:disabled) { background: var(--chip); }
  .ib:disabled { opacity: .35; cursor: default; }
  .tabs { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; }
  .tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font: inherit; }
  .tab[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px #0001; font-weight: 600; }
  form { display: flex; flex: 1; min-width: 160px; max-width: 420px; }
  input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; padding: 0 10px; font: inherit; outline: none; }
  input:focus { border-color: var(--brand); }
  form button { height: 32px; border: 1px solid var(--line); background: #fff; border-radius: 0 8px 8px 0; padding: 0 12px; cursor: pointer; font: inherit; }
  form button:hover { background: var(--chip); }
  .status { flex: 1; min-width: 0; text-align: right; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.error { color: var(--warn); white-space: normal; line-height: 1.3; max-height: 34px; }
  .status.done { color: var(--brand); }
  .status a { color: var(--brand); font-weight: 600; cursor: pointer; text-decoration: underline; }
  .cta { height: 36px; border: 0; border-radius: 9px; padding: 0 16px; background: var(--brand); color: var(--brand-ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .cta:hover:not(:disabled) { filter: brightness(1.08); }
  .cta:disabled { opacity: .6; cursor: progress; }
  .spin { width: 12px; height: 12px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: s .8s linear infinite; display: none; }
  .cta.busy .spin { display: inline-block; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bar">
  <div class="nav">
    <button class="ib" id="back" title="后退" aria-label="后退"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <button class="ib" id="forward" title="前进" aria-label="前进"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <button class="ib" id="reload" title="刷新" aria-label="刷新"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.8h-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  </div>
  <div class="tabs" role="group" aria-label="平台">
    <button class="tab" data-p="douyin">抖音</button>
    <button class="tab" data-p="xiaohongshu">小红书</button>
    <button class="tab" data-p="bilibili">B站</button>
  </div>
  <form id="search"><input id="kw" placeholder="搜城市 + 行业，比如：长沙 烤鱼" autocomplete="off"><button type="submit">搜索</button></form>
  <div class="status" id="status">打开一条视频，看到它在播放了，点右边「同款复刻」</div>
  <button class="cta" id="capture"><span class="spin"></span><span id="ctaText">同款复刻</span></button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let state = { platform: 'douyin' };
  const HINT = '打开一条视频，看到它在播放了，点右边「同款复刻」';
  $('back').onclick = () => browseUI.act('back');
  $('forward').onclick = () => browseUI.act('forward');
  $('reload').onclick = () => browseUI.act('reload');
  $('capture').onclick = () => browseUI.act('capture');
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
    const kw = $('kw').value.trim();
    if (kw) browseUI.act('search', { platform: t.dataset.p, keyword: kw });
    else browseUI.act('home', t.dataset.p);
  });
  $('search').onsubmit = (e) => {
    e.preventDefault();
    const kw = $('kw').value.trim();
    if (kw) browseUI.act('search', { platform: state.platform === 'other' ? 'douyin' : state.platform, keyword: kw });
  };
  $('status').onclick = (e) => { if (e.target.closest('a')) browseUI.act('show-project'); };
  browseUI.onState((s) => {
    state = s;
    $('back').disabled = !s.canBack;
    $('forward').disabled = !s.canForward;
    document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.p === s.platform)));
    if (s.keyword && document.activeElement !== $('kw')) $('kw').value = s.keyword;
    const st = $('status');
    st.className = 'status ' + (s.status.kind || '');
    st.textContent = s.status.text || (s.loading ? '加载中…' : HINT);
    if (s.status.kind === 'done') {
      const a = document.createElement('a'); a.textContent = '去看看 →';
      st.append(' ', a);
    }
    $('capture').disabled = !!s.busy;
    $('capture').classList.toggle('busy', !!s.busy);
    $('ctaText').textContent = s.busy ? '处理中' : '同款复刻';
  });
  browseUI.act('state');
</script>
</body>
</html>
